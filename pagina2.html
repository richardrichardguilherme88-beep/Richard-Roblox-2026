<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richard Player — Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #cc0000;
            font-size: 32px;
        }

        .bemvindo {
            color: #663300;
            font-size: 18px;
            margin-top: 8px;
        }

        .grade {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .botao {
            background: white;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }

        .botao:hover {
            transform: scale(1.05);
        }

        .icone {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .nome {
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }

        .voltar {
            margin-top: 40px;
            color: #cc0000;
            text-decoration: none;
            font-size: 16px;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        .versao {
            margin-top: 20px;
            color: #995500;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="cabecalho">
        <h1>RICHARD PLAYER</h1>
        <p class="bemvindo">✅ Bem-vindo! Você entrou! ✨</p>
    </div>

    <div class="grade">
        <a href="#" class="botao">
            <div class="icone">🎮</div>
            <div class="nome">Jogos</div>
        </a>

        <a href="#" class="botao">
            <div class="icone">✉️</div>
            <div class="nome">Mensagens</div>
        </a>

        <a href="#" class="botao">
            <div class="icone">🎵</div>
            <div class="nome">Música</div>
        </a>

        <a href="#" class="botao">
            <div class="icone">🌐</div>
            <div class="nome">Navegar</div>
        </a>
    </div>

    <a href="login.html" class="voltar">← Sair / Voltar</a>
    
    <p class="versao">Versão Beta V0.7 © 2026</p>
</body>
</html>
